# The firm chart-of-accounts taxonomy, version 1.0.0.
#
# The canonical category list the tagging skills work against, with the two inclusion
# flags each category carries by default. Data rather than prompt text, so the people who
# own the convention can review and version it without touching a skill. The version a
# run used is pinned in its manifest and checked by the Policy Gate on every lookup.
#
# Every category declares:
#   statement         IS or BS - which statement the line belongs to
#   section           where on that statement it sits
#   excluded_from_al  default: is the line taken OUT of the operating assets & liabilities
#                     base (non-operating, valued or adjusted separately)? Always false on
#                     an income statement line - the flag is a balance-sheet question.
#   include_in_nwc    default: does the line count toward net working capital? Always
#                     false on an income statement line.
#   cues              words that usually mean this category. A hint for a reader of the
#                     file, not a rule: the tagging skill reads descriptions, not cues,
#                     and a proposal that disagrees with a cue is not wrong for that.
#
# A proposal whose flags differ from the category's defaults is allowed - edge cases are
# real - and always goes to a person, because a departure from the firm rule is a
# judgment call. `unmapped` is the one category a proposal may pair with
# `uncategorisable: true`; it means "a person assigns this", never "probably other".
#
# Synthetic defaults. Chartwell's own conventions replace these at the P24 pilot, under
# a new version; this file stays listed for as long as any recorded run cites it.

version: 1.0.0
title: Chartwell chart-of-accounts taxonomy
effective: 2026-09-01

rules:
  al_exclusion: >-
    Excluded from A/L marks a balance-sheet line that is removed from the operating
    asset and liability base and dealt with separately: excess cash, investments and
    notes not needed in operations, amounts due to or from owners and related parties,
    interest-bearing debt, and equity. Operating assets and liabilities stay in.
  nwc_inclusion: >-
    Include in NWC marks the operating current items that make up net working capital:
    receivables, inventory, prepaids and other operating current assets on one side;
    payables, accrued liabilities, deferred revenue and other operating current
    liabilities on the other. Cash and interest-bearing debt are never NWC, whatever
    their maturity.
  income_statement: >-
    An income statement line carries both flags false. The flags describe the balance
    sheet; a revenue or expense line has no A/L or NWC treatment to record.
  departures: >-
    A tag may depart from a category's default flags when the description warrants it.
    Every departure is reviewed by a person; none is auto-accepted.

categories:
  # ------------------------------------------------------------- income statement
  - id: revenue
    label: Revenue
    statement: IS
    section: revenue
    excluded_from_al: false
    include_in_nwc: false
    cues: [sales, revenue, fees earned, service income, contract revenue]
  - id: contra_revenue
    label: Returns, allowances and discounts
    statement: IS
    section: revenue
    excluded_from_al: false
    include_in_nwc: false
