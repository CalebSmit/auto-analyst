    include_in_nwc: false
    cues: [common stock, capital stock, paid-in capital, retained earnings, members equity, partners capital, treasury stock, distributions, dividends, draws]

  # ------------------------------------------------------------- the honest answer
  - id: unmapped
    label: Does not map - a person assigns
    statement: NA
    section: unmapped
    excluded_from_al: false
    include_in_nwc: false
    cues: []
    note: >-
      The only category that may carry `uncategorisable: true`. For a description too
      sparse or too odd to place; never for "probably other". Always reviewed.
