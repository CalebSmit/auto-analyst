    label: Cash and equivalents
    statement: BS
    section: current_assets
    excluded_from_al: true
    include_in_nwc: false
    cues: [cash, checking, savings, money market, petty cash]
  - id: accounts_receivable
    label: Accounts receivable
    statement: BS
    section: current_assets
    excluded_from_al: false
    include_in_nwc: true
    cues: [accounts receivable, a/r, trade receivables, receivables]
  - id: allowance_doubtful
    label: Allowance for doubtful accounts
    statement: BS
    section: current_assets
    excluded_from_al: false
    include_in_nwc: true
    cues: [allowance, doubtful accounts, reserve for bad debt]
  - id: inventory
    label: Inventory
    statement: BS
    section: current_assets
    excluded_from_al: false
    include_in_nwc: true
    cues: [inventory, raw materials, work in process, wip, finished goods]
  - id: prepaid_expenses
    label: Prepaid expenses
    statement: BS
    section: current_assets
    excluded_from_al: false
