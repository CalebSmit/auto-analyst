# The declared inputs of Chartwell_Master_Model_v14.xlsx at template version 14.2.
#
# The firm default. Same fourteen income-statement lines over three fiscal years as the
# ESOP model, the same benchmark, and no ESOP schedules - which is why the ESOP segment
# binds its own model rather than inheriting this one.
#
# Synthetic; Chartwell's own template registers under a new version at the P24 pilot.

template: Chartwell_Master_Model_v14.xlsx
template_version: "14.2"
scale: 1
currency: USD

stamps:
  - Template_Version
  - Run_Id

required:
  - { name: Revenue_FY1, line: Revenue, period: FY1 }
  - { name: Revenue_FY2, line: Revenue, period: FY2 }
  - { name: Revenue_FY3, line: Revenue, period: FY3 }
  - { name: COGS_FY1, line: Cost of sales, period: FY1 }
  - { name: COGS_FY2, line: Cost of sales, period: FY2 }
  - { name: COGS_FY3, line: Cost of sales, period: FY3 }
  - { name: Officer_Comp_FY1, line: Officer compensation, period: FY1 }
  - { name: Officer_Comp_FY2, line: Officer compensation, period: FY2 }
  - { name: Officer_Comp_FY3, line: Officer compensation, period: FY3 }
  - { name: Wages_FY1, line: Wages, period: FY1 }
  - { name: Wages_FY2, line: Wages, period: FY2 }
  - { name: Wages_FY3, line: Wages, period: FY3 }
  - { name: Payroll_Taxes_FY1, line: Payroll taxes, period: FY1 }
  - { name: Payroll_Taxes_FY2, line: Payroll taxes, period: FY2 }
  - { name: Payroll_Taxes_FY3, line: Payroll taxes, period: FY3 }
  - { name: Rent_FY1, line: Rent, period: FY1 }
  - { name: Rent_FY2, line: Rent, period: FY2 }
  - { name: Rent_FY3, line: Rent, period: FY3 }
  - { name: Repairs_FY1, line: Repairs and maintenance, period: FY1 }
  - { name: Repairs_FY2, line: Repairs and maintenance, period: FY2 }
  - { name: Repairs_FY3, line: Repairs and maintenance, period: FY3 }
  - { name: Utilities_FY1, line: Utilities, period: FY1 }
  - { name: Utilities_FY2, line: Utilities, period: FY2 }
  - { name: Utilities_FY3, line: Utilities, period: FY3 }
  - { name: Insurance_FY1, line: Insurance, period: FY1 }
  - { name: Insurance_FY2, line: Insurance, period: FY2 }
  - { name: Insurance_FY3, line: Insurance, period: FY3 }
  - { name: Professional_Fees_FY1, line: Professional fees, period: FY1 }
  - { name: Professional_Fees_FY2, line: Professional fees, period: FY2 }
  - { name: Professional_Fees_FY3, line: Professional fees, period: FY3 }
  - { name: Depreciation_FY1, line: Depreciation, period: FY1 }
  - { name: Depreciation_FY2, line: Depreciation, period: FY2 }
  - { name: Depreciation_FY3, line: Depreciation, period: FY3 }
  - { name: Travel_FY1, line: Travel, period: FY1 }
  - { name: Travel_FY2, line: Travel, period: FY2 }
  - { name: Travel_FY3, line: Travel, period: FY3 }
  - { name: Office_FY1, line: Office supplies, period: FY1 }
  - { name: Office_FY2, line: Office supplies, period: FY2 }
  - { name: Office_FY3, line: Office supplies, period: FY3 }
  - { name: Other_Opex_FY1, line: Other operating expense, period: FY1 }
  - { name: Other_Opex_FY2, line: Other operating expense, period: FY2 }
  - { name: Other_Opex_FY3, line: Other operating expense, period: FY3 }
  - { name: Owner_Comp_Benchmark, line: Owner-compensation benchmark, period: as_of }

optional:
  - { name: WACC_Terminal, line: Terminal WACC, period: valuation_date }
  - { name: NWC_Target, line: Target net working capital, period: valuation_date }
  - { name: EV_EBITDA_Multiple, line: Selected EV/EBITDA multiple, period: valuation_date }
