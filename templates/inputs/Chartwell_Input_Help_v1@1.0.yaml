# The declared inputs of Chartwell_Input_Help_v1.xlsx - version 1's deliverable.
#
# **This is not a model.** It is a workbook laid out like the model's Input tab, which a
# person copies from into the real model. The analyst set version 1's scope that way in the
# fourth interview: *"gathering data and putting it into the same format every time so it is
# really easy for me to do the work in the model. Version 1 of this is not for you to run
# the actual model."*
#
# Why it exists as its own template rather than as the master one. The two recipes that
# reach a release step write through `Chartwell_Master_Model_v14`, and a run writing into
# something shaped like the firm's model is one filename away from being mistaken for it.
# A separate workbook cannot be: it opens on a sheet that says what it is not.
#
# The fourteen income-statement lines over three fiscal years are the master template's own
# declared inputs, because "matching the model's input format" is the whole point. What is
# dropped are the three the model computes for itself - terminal WACC, target net working
# capital and the selected multiple - which belong to `cost-of-capital`, `dcf-build` and
# `gpc-scrub`. All three are outside version 1 and all three are skeletons.
#
# Synthetic, like the templates beside it. Chartwell's own `Model Template - MASTER 2026`
# is owed on BUILD/OPEN.md; when it arrives this schema is re-derived from its Input tab
# and registered at a new version, and the recipe does not change.

template: Chartwell_Input_Help_v1.xlsx
template_version: "1.0"
kind: input_help

# The firm's own convention, given by the analyst on 2026-09-22: **the statements always go
# into the model in thousands**, and they almost never arrive that way - a client sends
# units. So the workbook declares thousands, and a figure read in units has to be restated
# before it can be written here.
#
# That restatement is arithmetic, and `deliver/builder.py` refuses to do it: *"restating is
# arithmetic and does not happen in the writer"*. Dividing by a thousand in the last step
# before a cell would put the one operation nobody can see underneath the one number
# everybody reads. It happens upstream, on the record, or it does not happen.
scale: 1000
currency: USD

# A cell beside every value saying which document and which row the figure came from.
# Declared here and nowhere else, because it is not ours to add to the firm's own model:
# this workbook exists to be copied from and therefore to be checked, and the master
# template is a stand-in for one Chartwell maintains.
#
# The names are derived - <input>__Source - rather than listed, so they cannot fall out of
# step with the inputs they mirror. They are stamps: the writer owns them and a mapping
# may never name one, which is what stops a model writing its own provenance.
sources_beside_values: true

stamps:
  - Template_Version
  - Run_Id

required:
  - { name: Revenue_FY1, line: Revenue, period: FY1 }
  - { name: Revenue_FY2, line: Revenue, period: FY2 }
  - { name: Revenue_FY3, line: Revenue, period: FY3 }
  - { name: COGS_FY1, line: Cost of sales, period: FY1 }
  - { name: COGS_FY2, line: Cost of sales, period: FY2 }
  - { name: COGS_FY3, line: Cost of sales, period: FY3 }
  - { name: Officer_Comp_FY1, line: Officer compensation, period: FY1 }
  - { name: Officer_Comp_FY2, line: Officer compensation, period: FY2 }
  - { name: Officer_Comp_FY3, line: Officer compensation, period: FY3 }
