# Read from the client's own file when it is there, and left blank when it is not. An
# owner-compensation benchmark is a judgement rather than a reading, so version 1 does not
# originate one - it carries what a person put in the engagement profile, or nothing.
optional:
  - { name: Owner_Comp_Benchmark, line: Owner-compensation benchmark, period: as_of }
