[project]
name = "automated-analyst"
version = "0.1.0"
description = "Chartwell Automated Analyst - AI DDR & Model Loader pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Declared rather than inherited from anthropic: the Box and ShareFile adapters
    # speak HTTP directly, and a transitive dependency is how an unrelated package
    # bump breaks an adapter nobody touched.
    "httpx2>=2.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "cryptography>=43",
    "rq>=2.12.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # The Postgres driver is a dev dependency because the only thing that reaches it
    # before P25 is `pytest --postgres`. Without it, asking for the Postgres run would
    # fail as a missing module and read like an unreachable server, which is the one
    # confusion the whole --postgres arrangement exists to avoid.
    "psycopg[binary]>=3.2",
    "fakeredis>=2.37.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
