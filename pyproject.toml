[project]
name = "automated-analyst"
version = "0.1.0"
description = "Chartwell Automated Analyst - AI DDR & Model Loader pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # Where a row and a column are on the page, which the text stream does not say.
    # pypdf reads the text; a real filing sets a grand total on a ruled row and emits
    # the label and its figures as separate runs, so "Total assets" and "$ 521,728"
    # arrived as two lines and the row was built by nothing. pdfminer.six underneath,
    # pure Python, no system dependency, and it reaches neither a network nor a model.
    "pdfplumber>=0.11.10",
    "python-docx>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Declared rather than inherited from anthropic: the Box and ShareFile adapters
    # speak HTTP directly, and a transitive dependency is how an unrelated package
    # bump breaks an adapter nobody touched.
    "httpx2>=2.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "cryptography>=43",
    "rq>=2.12.0",
    "redis>=8.1.0",
    # Reads the old binary .xls, which openpyxl never could. The routing table has
    # declared .xls a spreadsheet since it was written and the only reader behind it was
    # openpyxl, so one came back as "BadZipFile: File is not a zip file". Pure Python.
    "xlrd>=2.0.2",
    # An RTF is text with its formatting written into it, so the reader that met one
    # stored the control words as lines of a document and sent them to a model. Pure
    # Python, no system dependency. Measured over the escapes that matter: it leaves the
    # font table, the stylesheet and the generator behind, and keeps the dollar sign, the
    # accent and the em dash.
    "striprtf>=0.0.33",
    # An OpenDocument spreadsheet is what a client on LibreOffice sends instead of an
    # .xlsx, and it reached kind="other" - routed nowhere, read by nothing. Pure Python,
    # no system dependency, and it brings defusedxml with it, which is the right thing to
    # gain on a path that opens a client file: an ODS is a zip of XML, and XML from
    # outside is where entity expansion lives. Read for the cell's declared type rather
    # than its display text, because LibreOffice writes the display in the locale the
    # file was saved in and both readings of `1.234,5` are plausible figures.
    "odfpy>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # The Postgres driver is a dev dependency because the only thing that reaches it
    # before P25 is `pytest --postgres`. Without it, asking for the Postgres run would
    # fail as a missing module and read like an unreachable server, which is the one
    # confusion the whole --postgres arrangement exists to avoid.
    "psycopg[binary]>=3.2",
    "fakeredis>=2.37.1",
    # Writes the old binary .xls, so the reader that reads one is tested against a real
    # file rather than against bytes somebody hand-made. Nothing ships it: this build
    # never writes an .xls, it only has to read what a client sends.
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
